name: Deploy develop to GitHub Pages

on:
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify metadata stamping
        run: node --test tests/integration/build-metadata.test.mjs
      - uses: actions/configure-pages@v5
      - name: Stage game and inject deployed version
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          mkdir -p _site/src
          cp index.html _site/index.html
          cp src/*.js src/*.css src/*.svg _site/src/
          node scripts/stamp-build.mjs _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
